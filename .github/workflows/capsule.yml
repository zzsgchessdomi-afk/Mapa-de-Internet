name: AI Capsule Contract

on:
  push:
    branches: [main]
    paths:
      - "lib/capsule-core.js"
      - "scripts/capsule_cli.mjs"
      - "AICAPSULE_SPEC.md"
      - "package.json"
      - "index.html"
      - "tools/capsule-viewer.html"
      - "desktop/scripts/prepare_app.mjs"
      - "schemas/**"
      - "sdk/**"
      - "tests/capsule-*.mjs"
      - "tests/index-inline-syntax.mjs"
      - ".github/actions/verify-aicapsule/**"
      - ".github/workflows/capsule.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/capsule-core.js"
      - "scripts/capsule_cli.mjs"
      - "AICAPSULE_SPEC.md"
      - "package.json"
      - "index.html"
      - "tools/capsule-viewer.html"
      - "desktop/scripts/prepare_app.mjs"
      - "schemas/**"
      - "sdk/**"
      - "tests/capsule-*.mjs"
      - "tests/index-inline-syntax.mjs"
      - ".github/actions/verify-aicapsule/**"
      - ".github/workflows/capsule.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run test:capsule
      - name: Verify desktop Capsule payload
        shell: bash
        run: |
          node desktop/scripts/prepare_app.mjs
          test -f desktop/app/lib/capsule-core.js
          test -f desktop/app/tools/capsule-viewer.html
          grep -q 'capsule-core.js' desktop/app/index.html
      - name: Create signed Capsule fixture
        run: node tests/create-signed-fixture.mjs
      - name: Verify signed Capsule with Atlanex Action
        uses: ./.github/actions/verify-aicapsule
        with:
          capsule-path: tests/.tmp-signed.aicapsule
          require-signature: "true"
          trusted-public-key: tests/.tmp-public.jwk.json
