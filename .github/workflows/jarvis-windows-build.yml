name: JARVIS Windows Build

on:
  push:
    branches:
      - jarvis-apk-build-v06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Windows v0.8 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "jarvis-build/windows-single/c_*.b64" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("jarvis_windows_single.py", [Convert]::FromBase64String($b64))

          $baseHash = (Get-FileHash "jarvis_windows_single.py" -Algorithm SHA256).Hash.ToLower()
          Write-Host "base_source_sha256=$baseHash"
          if ($baseHash -ne "e5468cb09c85cce6b819d5c2100c4c46bae18e064df44bf5ef740db771b1e418") {
            throw "Base source integrity check failed"
          }

          $patchB64 = (Get-Content "jarvis-build/windows-single/p08_00.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("windows_v08.patch", [Convert]::FromBase64String($patchB64))
          $patchHash = (Get-FileHash "windows_v08.patch" -Algorithm SHA256).Hash.ToLower()
          Write-Host "patch_sha256=$patchHash"
          if ($patchHash -ne "7cc61eb85f8f0d9d949daa5e1da0036d2af9efb1f5c68295e95e954a0c87d651") {
            throw "v0.8 patch integrity check failed"
          }

          git apply --whitespace=nowarn "windows_v08.patch"
          if ($LASTEXITCODE -ne 0) { throw "v0.8 patch apply failed" }

          $newHash = (Get-FileHash "jarvis_windows_single.py" -Algorithm SHA256).Hash.ToLower()
          Write-Host "v08_source_sha256=$newHash"
          if ($newHash -ne "407efd21fd1e11564caca386aad6ed8cdd167b18e4cf26d824dbf24e3d2507c6") {
            throw "v0.8 source integrity check failed"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile source
        run: python -m py_compile jarvis_windows_single.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller "cryptography>=46,<47" "websockets>=16,<17"

      - name: Build native Windows executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name "JARVIS Mesh" --collect-submodules websockets jarvis_windows_single.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/JARVIS Mesh.exe")) { throw "Executable missing" }
          $file = Get-Item "dist/JARVIS Mesh.exe"
          Write-Host "size=$($file.Length)"
          Get-FileHash "dist/JARVIS Mesh.exe" -Algorithm SHA256

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }

      - name: Create commercial-style installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @'
          #define MyAppName "JARVIS Mesh"
          #define MyAppVersion "0.8.0"
          #define MyAppExeName "JARVIS Mesh.exe"

          [Setup]
          AppId={{8C1FE057-3D21-45BD-A4D0-0CBFB8D74538}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=JARVIS Mesh
          DefaultDirName={localappdata}\Programs\JARVIS Mesh
          DefaultGroupName=JARVIS Mesh
          DisableProgramGroupPage=yes
          OutputDir=installer
          OutputBaseFilename=JARVIS-Mesh-Setup-v0.8
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Files]
          Source: "dist\JARVIS Mesh.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\JARVIS Mesh"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\JARVIS Mesh"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Abrir JARVIS Mesh"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path "JARVIS-Mesh.iss" -Encoding UTF8

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "JARVIS-Mesh.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Verify installer
        shell: pwsh
        run: |
          if (!(Test-Path "installer/JARVIS-Mesh-Setup-v0.8.exe")) { throw "Installer missing" }
          $file = Get-Item "installer/JARVIS-Mesh-Setup-v0.8.exe"
          Write-Host "installer_size=$($file.Length)"
          Get-FileHash "installer/JARVIS-Mesh-Setup-v0.8.exe" -Algorithm SHA256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mesh-Windows-v0.8
          path: dist/JARVIS Mesh.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mesh-Installer-v0.8
          path: installer/JARVIS-Mesh-Setup-v0.8.exe
          if-no-files-found: error
          retention-days: 7
