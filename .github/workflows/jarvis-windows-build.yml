name: JARVIS Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified Windows source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "jarvis-build/windows-single/c_*.b64" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("jarvis_windows_single.py", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "jarvis_windows_single.py" -Algorithm SHA256).Hash.ToLower()
          Write-Host "source_sha256=$hash"
          if ($hash -ne "e5468cb09c85cce6b819d5c2100c4c46bae18e064df44bf5ef740db771b1e418") {
            throw "Source integrity check failed"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile source
        run: python -m py_compile jarvis_windows_single.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller "cryptography>=46,<47" "websockets>=16,<17"

      - name: Build native Windows executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name "JARVIS Mesh" --collect-submodules websockets jarvis_windows_single.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/JARVIS Mesh.exe")) { throw "Executable missing" }
          $file = Get-Item "dist/JARVIS Mesh.exe"
          Write-Host "size=$($file.Length)"
          Get-FileHash "dist/JARVIS Mesh.exe" -Algorithm SHA256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mesh-Windows-v0.7
          path: dist/JARVIS Mesh.exe
          if-no-files-found: error
          retention-days: 7
