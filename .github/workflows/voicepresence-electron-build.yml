name: VoicePresence Electron Windows Build

on:
  push:
    branches:
      - voicepresence-electron-build-200
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Rehydrate VoicePresence 2.0 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voicepresence-electron | Out-Null
          $parts = Get-ChildItem ".vpbuild\source.part.*" | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$PWD\.vpbuild\source.tar.xz", [Convert]::FromBase64String($b64))
          tar -xJf ".vpbuild\source.tar.xz" -C "voicepresence-electron"
          if (!(Test-Path "voicepresence-electron\package.json")) { throw "Source rehydration failed" }

      - name: Apply VoicePresence 2.1 guided-session core
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".vpbuild\v21.part.*" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 v2.1 patch chunks, found $($parts.Count)" }
          ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "" | Set-Content ".vpbuild\apply-v21-exact.cjs" -Encoding UTF8
          node ".vpbuild\apply-v21-exact.cjs" "voicepresence-electron"
          node --check "voicepresence-electron\renderer\app.js"

      - name: Apply VoicePresence 2.2 command-center UI
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".vpbuild\v22.part.*" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 v2.2 patch chunks, found $($parts.Count)" }
          ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join "" | Set-Content ".vpbuild\apply-v22-exact.cjs" -Encoding UTF8
          node ".vpbuild\apply-v22-exact.cjs" "voicepresence-electron"
          node --check "voicepresence-electron\renderer\app.js"
          $pkg = Get-Content "voicepresence-electron\package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "2.2.0") { throw "Version patch failed: $($pkg.version)" }
          $pkg.build.win.artifactName = "VoicePresence-2.2.0-Windows-x64.exe"
          $pkg.build.portable.artifactName = "VoicePresence-2.2.0-Windows-x64.exe"
          $pkg | ConvertTo-Json -Depth 50 | Set-Content "voicepresence-electron\package.json" -Encoding UTF8
          $app = Get-Content "voicepresence-electron\renderer\app.js" -Raw
          foreach ($marker in @("command-center","missionScreen","INICIAR SESIÓN GUIADA","startGuidedSession","showSessionComparison")) {
            if (-not $app.Contains($marker)) { throw "Missing v2.2 marker: $marker" }
          }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact dependencies
        working-directory: voicepresence-electron
        run: npm install --no-audit --no-fund

      - name: Audit project matrix
        working-directory: voicepresence-electron
        run: npm test

      - name: Build portable Electron EXE
        working-directory: voicepresence-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64

      - name: Verify Windows binary
        shell: pwsh
        run: |
          $p = "voicepresence-electron\dist\VoicePresence-2.2.0-Windows-x64.exe"
          if (!(Test-Path $p)) { throw "EXE missing" }
          $f = Get-Item $p
          if ($f.Length -lt 50000000) { throw "EXE unexpectedly small: $($f.Length)" }
          Get-FileHash $p -Algorithm SHA256
          Write-Host "EXE_BYTES=$($f.Length)"

      - name: Upload one-click Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoicePresence-2.2.0-Windows-x64
          path: voicepresence-electron/dist/VoicePresence-2.2.0-Windows-x64.exe
          if-no-files-found: error
          retention-days: 1
