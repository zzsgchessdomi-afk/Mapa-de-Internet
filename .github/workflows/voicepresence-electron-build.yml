name: VoicePresence 3.0 Windows Build

on:
  push:
    branches:
      - voicepresence-electron-build-200
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Rehydrate VoicePresence 3.0 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voicepresence-electron | Out-Null
          $parts = Get-ChildItem ".vpbuild\v30.part.*" | Sort-Object Name
          if ($parts.Count -ne 14) { throw "Expected 14 v3.0 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$PWD\.vpbuild\voicepresence3.tar.xz", [Convert]::FromBase64String($b64))
          tar -xJf ".vpbuild\voicepresence3.tar.xz" -C "voicepresence-electron"
          if (!(Test-Path "voicepresence-electron\package.json")) { throw "Source rehydration failed" }
          $pkg = Get-Content "voicepresence-electron\package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "3.0.0") { throw "Expected 3.0.0, got $($pkg.version)" }
          node --check "voicepresence-electron\renderer\app.js"
          node --check "voicepresence-electron\main.cjs"
          $app = Get-Content "voicepresence-electron\renderer\app.js" -Raw
          foreach ($marker in @("studioCapture","startDailyPlan","openMirrorStudio","showSessionComparisonV3","dailyPool","renderEntrenador")) {
            if (-not $app.Contains($marker)) { throw "Missing v3 marker: $marker" }
          }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact dependencies
        working-directory: voicepresence-electron
        run: npm install --no-audit --no-fund

      - name: Run complete VoicePresence 3.0 audit
        working-directory: voicepresence-electron
        run: npm test

      - name: Build one-click Electron EXE
        working-directory: voicepresence-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64

      - name: Verify Windows binary
        shell: pwsh
        run: |
          $p = "voicepresence-electron\dist\VoicePresence-3.0.0-Windows-x64.exe"
          if (!(Test-Path $p)) { throw "EXE missing" }
          $f = Get-Item $p
          if ($f.Length -lt 50000000) { throw "EXE unexpectedly small: $($f.Length)" }
          $hash = Get-FileHash $p -Algorithm SHA256
          Write-Host "EXE_BYTES=$($f.Length)"
          Write-Host "EXE_SHA256=$($hash.Hash)"

      - name: Upload VoicePresence 3.0 EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoicePresence-3.0.0-Windows-x64
          path: voicepresence-electron/dist/VoicePresence-3.0.0-Windows-x64.exe
          if-no-files-found: error
          retention-days: 1
