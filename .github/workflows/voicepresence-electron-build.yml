name: VoicePresence Electron Windows Build

on:
  push:
    branches:
      - voicepresence-electron-build-200
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Rehydrate VoicePresence 3.0 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voicepresence-electron | Out-Null
          $parts = Get-ChildItem ".vpbuild\v30.part.*" | Sort-Object Name
          if ($parts.Count -ne 14) { throw "Expected 14 v3.0 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$PWD\.vpbuild\v30-source.tar.xz", [Convert]::FromBase64String($b64))
          tar -xJf ".vpbuild\v30-source.tar.xz" -C "voicepresence-electron"
          if (!(Test-Path "voicepresence-electron\package.json")) { throw "v3.0 source rehydration failed" }
          node --check "voicepresence-electron\renderer\app.js"
          $pkg = Get-Content "voicepresence-electron\package.json" -Raw | ConvertFrom-Json
          Write-Host "VERSION=$($pkg.version)"
          if ($pkg.version -ne "3.0.0") { throw "Expected VoicePresence 3.0.0, got $($pkg.version)" }

      - name: Verify v3.0 source integrity
        shell: pwsh
        run: |
          node --check "voicepresence-electron\\renderer\\app.js"
          node --check "voicepresence-electron\\main.cjs"
          $pkg = Get-Content "voicepresence-electron\\package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "3.0.0") { throw "Unexpected version: $($pkg.version)" }
          if (!(Test-Path "voicepresence-electron\\renderer\\index.html")) { throw "UI entry missing" }
          if (!(Test-Path "voicepresence-electron\\tests.cjs")) { throw "Audit suite missing" }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: voicepresence-electron
        run: npm install --no-audit --no-fund

      - name: Run full audit suite
        working-directory: voicepresence-electron
        run: npm test

      - name: Build portable Electron EXE
        working-directory: voicepresence-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64

      - name: Verify Windows binary
        shell: pwsh
        run: |
          $p = Get-ChildItem "voicepresence-electron\dist\*.exe" | Where-Object { $_.Name -like "*3.0.0*" } | Select-Object -First 1
          if (-not $p) { throw "VoicePresence 3.0.0 EXE missing" }
          if ($p.Length -lt 50000000) { throw "EXE unexpectedly small: $($p.Length)" }
          Write-Host "EXE_PATH=$($p.FullName)"
          Write-Host "EXE_BYTES=$($p.Length)"
          Get-FileHash $p.FullName -Algorithm SHA256

      - name: Normalize artifact name
        shell: pwsh
        run: |
          $p = Get-ChildItem "voicepresence-electron\dist\*.exe" | Where-Object { $_.Name -like "*3.0.0*" } | Select-Object -First 1
          Copy-Item $p.FullName "voicepresence-electron\dist\VoicePresence-3.0.0-Windows-x64.exe" -Force

      - name: Upload one-click Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoicePresence-3.0.0-Windows-x64
          path: voicepresence-electron/dist/VoicePresence-3.0.0-Windows-x64.exe
          if-no-files-found: error
          retention-days: 1
