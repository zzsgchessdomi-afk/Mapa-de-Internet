name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Root static checks
        run: npm run check
      - name: Research provider contract
        run: npm run test:contract
      - name: Install Agent Engine dependencies
        working-directory: desktop
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .build-venv
          & ./.build-venv/Scripts/python.exe -m pip install --upgrade pip wheel pyinstaller
          & ./.build-venv/Scripts/python.exe scripts/install_agent_dependencies.py
      - name: Build Agent Engine with PyInstaller
        working-directory: desktop
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location sidecar
          & ../.build-venv/Scripts/python.exe -m PyInstaller --noconfirm --clean atlas_agent.spec
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed: $LASTEXITCODE" }
      - name: Stage Agent Engine and licenses
        working-directory: desktop
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path bundled-agent-engine) { Remove-Item bundled-agent-engine -Recurse -Force }
          Copy-Item sidecar/dist/atlas-agent-engine bundled-agent-engine -Recurse
          & ./.build-venv/Scripts/python.exe scripts/collect_python_licenses.py
          Copy-Item ../THIRD_PARTY_NOTICES.md bundled-agent-engine/THIRD_PARTY_NOTICES.md
      - name: Packaged Agent Engine self-test
        working-directory: desktop
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:ATLAS_SELF_TEST_LOG = Join-Path $PWD 'agent-self-test.json'
          $p = Start-Process -FilePath ./bundled-agent-engine/atlas-agent-engine.exe -ArgumentList '--self-test' -PassThru -Wait
          if (Test-Path $env:ATLAS_SELF_TEST_LOG) { Get-Content $env:ATLAS_SELF_TEST_LOG -Raw | Write-Host }
          if ($p.ExitCode -ne 0) { throw "Bundled Agent Engine self-test failed: $($p.ExitCode)" }
      - name: Packaged Agent Engine deep self-test
        working-directory: desktop
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:ATLAS_SELF_TEST_LOG = Join-Path $PWD 'agent-self-test-deep.json'
          $p = Start-Process -FilePath ./bundled-agent-engine/atlas-agent-engine.exe -ArgumentList '--self-test-deep' -PassThru -Wait
          if (Test-Path $env:ATLAS_SELF_TEST_LOG) { Get-Content $env:ATLAS_SELF_TEST_LOG -Raw | Write-Host }
          if ($p.ExitCode -ne 0) { throw "Bundled Agent Engine deep self-test failed: $($p.ExitCode)" }
      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Desktop static checks
        working-directory: desktop
        run: npm run check
      - name: Build NSIS + Portable EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Acceptance-test packaged portable build
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Internet-Atlas-Portable-*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Portable EXE not found' }
          $env:ATLAS_ACCEPTANCE_LOG = Join-Path $PWD 'acceptance-portable.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--acceptance-test' -PassThru -Wait
          if (Test-Path $env:ATLAS_ACCEPTANCE_LOG) { Get-Content $env:ATLAS_ACCEPTANCE_LOG -Raw | Write-Host }
          if ($p.ExitCode -ne 0) { throw "Portable acceptance test failed: $($p.ExitCode)" }
      - name: Install NSIS build and acceptance-test installed application
        working-directory: desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Internet-Atlas-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer not found' }
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed: $($install.ExitCode)" }
          Start-Sleep -Seconds 2
          $appExe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Internet Atlas.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) { throw 'Installed Internet Atlas.exe not found' }
          $env:ATLAS_ACCEPTANCE_LOG = Join-Path $PWD 'acceptance-installed.json'
          $test = Start-Process -FilePath $appExe.FullName -ArgumentList '--acceptance-test' -PassThru -Wait
          if (Test-Path $env:ATLAS_ACCEPTANCE_LOG) { Get-Content $env:ATLAS_ACCEPTANCE_LOG -Raw | Write-Host }
          if ($test.ExitCode -ne 0) { throw "Installed app acceptance test failed: $($test.ExitCode)" }
          $uninstaller = Get-ChildItem $appExe.DirectoryName -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller not found' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstall.ExitCode)" }
      - name: Generate SHA256SUMS
        working-directory: desktop
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Internet-Atlas-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS.txt
            desktop/bundled-agent-engine/THIRD_PARTY_PYTHON_LICENSES.json
            desktop/bundled-agent-engine/THIRD_PARTY_NOTICES.md
            desktop/bundled-agent-engine/licenses/**
          if-no-files-found: error
